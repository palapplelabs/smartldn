# Needs nginx-smartldn-cache.conf. Inside the `server { listen 443 ...; server_name labs.palapple.com; }` block of
# /etc/nginx/conf.d/labs.conf, above `location / { ... }`. The full URI is passed
# through because the app is built with NEXT_PUBLIC_BASE_PATH=/smartldn.

    # ── SmartLDN ──────────────────────────────────────────────
    # Build files never change under their hashed names: nginx keeps a copy, so the app
    # serves each one once per deploy. The cache holds the app's gzipped copy, so nothing
    # is compressed per request; gunzip unpacks it for the rare client without gzip.
    location ^~ /smartldn/_next/static/ {
        proxy_pass http://127.0.0.1:4317;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Accept-Encoding gzip;
        proxy_cache smartldn;
        proxy_cache_valid 200 7d;
        proxy_cache_lock on;
        add_header X-Cache $upstream_cache_status;
        gunzip on;
    }

    # Live feeds: every visitor sees the same reading, and the app's own upstream
    # caches already hold each feed for 15 s or more, so a 5 s shared copy costs no
    # freshness and lets one app request answer every visitor in that window.
    # Only GET/HEAD and only 200s are cached; the SNS POST passes straight through.
    location ^~ /smartldn/api/ {
        proxy_pass http://127.0.0.1:4317;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Accept-Encoding gzip;
        proxy_read_timeout 60s;
        proxy_connect_timeout 5s;
        client_max_body_size 1m;
        proxy_cache smartldn;
        proxy_cache_valid 200 5s;
        proxy_ignore_headers Cache-Control Expires;
        proxy_cache_lock on;
        proxy_cache_lock_timeout 10s;
        proxy_cache_use_stale updating error timeout;
        proxy_cache_background_update on;
        add_header X-Cache $upstream_cache_status;
        gunzip on;
    }

    location = /smartldn {
        proxy_pass http://127.0.0.1:4317;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /smartldn/ {
        proxy_pass http://127.0.0.1:4317;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 5s;
        client_max_body_size 1m;
    }
