# /etc/nginx/conf.d/smartldn-cache.conf (http level). Cache zone for the SmartLDN
# locations in nginx-labs.conf. SELinux: create with `mkdir -p /var/cache/nginx/smartldn
# && chown nginx /var/cache/nginx/smartldn && restorecon -R /var/cache/nginx`.
proxy_cache_path /var/cache/nginx/smartldn levels=1:2 keys_zone=smartldn:10m max_size=200m inactive=7d use_temp_path=off;
